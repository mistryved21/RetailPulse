services:
  postgres:
    image: postgres:15-alpine
    container_name: retailpulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: retailpulse_db
      POSTGRES_USER: retailpulse
      POSTGRES_PASSWORD: retailpulse123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailpulse -d retailpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  fastapi:
    build: .
    container_name: retailpulse_fastapi
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://retailpulse:retailpulse123@postgres:5432/retailpulse_db
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ENVIRONMENT: development
      REPORTS_DIR: /app/reports
    volumes:
      - reports_data:/app/reports
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: python main.py

  streamlit:
    build: .
    container_name: retailpulse_streamlit
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://retailpulse:retailpulse123@postgres:5432/retailpulse_db
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      REPORTS_DIR: /app/reports
    volumes:
      - reports_data:/app/reports
    ports:
      - "8501:8501"
    depends_on:
      - fastapi
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true

volumes:
  postgres_data:
  reports_data:

networks:
  default:
    name: retailpulse_network
